apiVersion: v1
kind: Service
metadata:
  name: events-public
  namespace: events-tache
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-internal: "false"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: events
  ports:
    - name: http
      port: 80
      targetPort: 8089
      protocol: TCP
