apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../namespace.yaml
  - ../mysql.yaml
  - ../application.yaml
  - ../grafana.yaml
  - storage.yaml
  - prometheus.yaml
  - jenkins-rbac.yaml
images:
  - name: events-tache
    newName: ayyoub1/events-tache
    digest: sha256:5c4ff54095b9ae76310a7ae1a661fffcd7d5d08c2b317289863c131da39dfe22
patches:
  - target:
      kind: PersistentVolumeClaim
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: events-gp3
  - target:
      kind: PersistentVolumeClaim
      name: mysql-data
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 4Gi
