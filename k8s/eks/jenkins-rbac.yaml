apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: events-tache
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer
  namespace: events-tache
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [events]
    verbs: [get, patch, watch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [events]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods/portforward]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: events-tache
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: events-tache
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer
