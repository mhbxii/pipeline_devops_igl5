name: events-app
services:
  mysql:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: eventsProject
      MYSQL_USER: events
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/Initialize-Lab.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/Initialize-Lab.ps1}
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -u events -D eventsProject -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 640m
  app:
    image: events-logistics:local
    build: .
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/eventsProject?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: events
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      LOGISTICS_LOG_LEVEL: DEBUG
    ports: ["127.0.0.1:8089:8089"]
    mem_limit: 512m
networks:
  default:
    name: events-devops
    external: true
volumes:
  mysql_data:
