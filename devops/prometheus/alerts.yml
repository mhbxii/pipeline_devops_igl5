groups:
  - name: events
    rules:
      - alert: EventsApplicationDown
        expr: up{job=~"events-.+"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Events application is unavailable ({{ $labels.job }})"
      - alert: EventsHighServerErrorRate
        expr: sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum by (job) (rate(http_server_requests_seconds_count[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests return server errors ({{ $labels.job }})"
