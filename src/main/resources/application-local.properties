# Dedicated Docker database; credentials are read from the process environment.
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/eventsProject?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=events
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
logging.level.tn.esprit.eventsproject.services.TacheService=DEBUG
