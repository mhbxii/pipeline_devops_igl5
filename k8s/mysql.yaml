apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  clusterIP: None
  selector: {app: mysql}
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - name: MYSQL_DATABASE
              value: eventsProject
            - name: MYSQL_USER
              value: events
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: events-db, key: password}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: events-db, key: root-password}
          ports: [{containerPort: 3306, name: mysql}]
          volumeMounts: [{name: data, mountPath: /var/lib/mysql}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 640Mi}
          startupProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u events -D eventsProject -e "SELECT 1"']
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u events -D eventsProject -e "SELECT 1"']
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
