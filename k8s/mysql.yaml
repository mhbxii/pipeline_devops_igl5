apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: events-tache
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: events-tache
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: mysql}
  template:
    metadata:
      labels: {app: mysql}
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--innodb-buffer-pool-size=128M", "--max-connections=40", "--performance-schema=OFF"]
          env:
            - {name: MYSQL_DATABASE, value: eventsProject}
            - {name: MYSQL_USER, value: events}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: password}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: database, key: root-password}
          ports: [{containerPort: 3306}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            exec:
              command: [sh, -c, 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -h127.0.0.1 -u"$MYSQL_USER" -D"$MYSQL_DATABASE" -e "SELECT 1"']
            initialDelaySeconds: 15
            periodSeconds: 10
          startupProbe:
            tcpSocket: {port: 3306}
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - {name: data, mountPath: /var/lib/mysql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: mysql-data}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: events-tache
spec:
  selector: {app: mysql}
  ports: [{port: 3306, targetPort: 3306}]
